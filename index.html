
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Referral Automation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap');
  :root{--bg:#0a0a0f;--surface:#111118;--surface2:#17171f;--border:#2a2a3a;--accent:#6ee7b7;--accent2:#818cf8;--error:#f87171;--text:#e2e8f0;--muted:#64748b;--cyan:#00d4c8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:40px 24px;background-image:radial-gradient(ellipse at 20% 0%,rgba(110,231,183,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(129,140,248,0.05) 0%,transparent 60%);}
  .container{max-width:680px;margin:0 auto;}
  .header{display:flex;align-items:center;gap:16px;margin-bottom:48px;}
  .logo{width:44px;height:44px;background:linear-gradient(135deg,var(--cyan),var(--accent2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
  .header p{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:3px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);opacity:0.4;}
  .lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:10px;display:block;}
  input[type="text"]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
  input[type="text"]:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(129,140,248,0.1);}
  input[type="text"]::placeholder{color:var(--muted);}
  .run-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--cyan));border:none;border-radius:12px;color:#0a0a0f;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;letter-spacing:0.5px;cursor:pointer;transition:opacity 0.2s,transform 0.1s;margin-top:22px;}
  .run-btn:hover:not(:disabled){opacity:0.9;transform:translateY(-1px);}
  .run-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
  .log-card{display:none;}.log-card.visible{display:block;}
  .log-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:20px;}
  .steps{display:flex;flex-direction:column;}
  .step{display:flex;gap:16px;align-items:flex-start;position:relative;}
  .step:not(:last-child)::after{content:'';position:absolute;left:15px;top:33px;bottom:0;width:1px;background:var(--border);}
  .step-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--border);background:var(--surface2);position:relative;z-index:1;transition:all 0.3s;}
  .step.pending .step-icon{color:var(--muted);}
  .step.running .step-icon{border-color:var(--accent2);background:rgba(129,140,248,0.1);color:var(--accent2);animation:pulse 1.5s infinite;}
  .step.done .step-icon{border-color:var(--accent);background:rgba(110,231,183,0.1);color:var(--accent);}
  .step.error .step-icon{border-color:var(--error);background:rgba(248,113,113,0.1);color:var(--error);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(129,140,248,0.4)}50%{box-shadow:0 0 0 6px rgba(129,140,248,0)}}
  .step-body{padding:5px 0 22px;flex:1;}
  .step-name{font-size:14px;font-weight:600;margin-bottom:2px;}
  .step.pending .step-name{color:var(--muted);}.step.running .step-name{color:var(--accent2);}.step.done .step-name,.step.error .step-name{color:var(--text);}
  .step-detail{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;line-height:1.6;}
  .step-detail a{color:var(--accent);text-decoration:none;}.step.error .step-detail{color:var(--error);}
  .result{display:none;border-radius:14px;padding:22px;margin-top:4px;}.result.visible{display:block;}
  .result.ok{background:rgba(110,231,183,0.05);border:1px solid rgba(110,231,183,0.2);}
  .result.fail{background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.2);}
  .result-title{font-size:15px;font-weight:700;margin-bottom:8px;}
  .result.ok .result-title{color:var(--accent);}.result.fail .result-title{color:var(--error);}
  .result-body{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;line-height:1.7;white-space:pre-wrap;word-break:break-all;}
  .result-body a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">⚡</div>
    <div><h1>Partner Referral Automation</h1><p>Jira Epic → Salesforce Campaign → Partner Email</p></div>
  </div>
  <div class="card">
    <label class="lbl">Jira Epic URL</label>
    <input type="text" id="jiraUrl" placeholder="https://xsolla.atlassian.net/browse/SP-XXXX" />
    <button class="run-btn" id="runBtn" onclick="run()">▶ Run Automation</button>
  </div>
  <div class="card log-card" id="logCard">
    <div class="log-title">Execution Log</div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="result" id="result">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-body" id="resultBody"></div>
  </div>
</div>
<script>
const N8N_EMAIL_WEBHOOK = 'https://n8n.xsolla.com/webhook/partner-referral-email';
const SF_INSTANCE = 'https://xsolla123.my.salesforce.com';
const SF_USER = 's.hatef@xsolla.com';
const SF_PASS = 'Examplepassword925!Zp2dTaueSRaW3D4ZU2iMbiYcL';
const JIRA_AUTH = "Basic cy5oYXRlZkB4c29sbGEuY29tOkFUQVRUM3hGZkdGMGhkWFZWUkNsSHdEam1sMS1MTFpSWGNEcUNwb3JRbWEwcGhRVDFWMmxVamJNdHFxaXZqaDJ4ZUxZa2daY29JR255NDdLblVmMTJzSVhvVU4tam95N1NLNFVuR0VndVU3c2p3bnVrMk5zcWlJcm9sY2NIeVdvYVZ1dHJoblk3NGhpWUhrY2tuMXRlQUJ1Sm84Rks1VXlIMzROc3A1cU9hWVRXOEkxSzk4bERjQT00QzdFNUVBMw==";
const JIRA_CLOUD = '9dfc393f-ac2d-4cef-8b1c-0657da26067f';
const MCP_JIRA = [{type:'url',url:'https://mcp.atlassian.com/v1/mcp',name:'atlassian'}];

const STEP_DEFS = [
  {id:'sf_auth',  icon:'🔐', name:'Authenticating with Salesforce',    msg:'Logging in...'},
  {id:'jira',     icon:'🔍', name:'Reading Jira Epic',                 msg:'Fetching epic details...'},
  {id:'sf_camp',  icon:'📣', name:'Creating Salesforce Campaign',      msg:'Setting up campaign...'},
  {id:'jira_link',icon:'🔗', name:'Linking Campaign to Jira Epic',     msg:'Adding web link...'},
  {id:'jira_close',icon:'✅',name:'Closing Jira Epic (Closed/Won)',    msg:'Transitioning status...'},
  {id:'email',    icon:'✉️', name:'Sending Partner Email',             msg:'Sending with badge attachments...'},
];

function initSteps(){
  document.getElementById('steps').innerHTML = STEP_DEFS.map(s=>`
    <div class="step pending" id="s_${s.id}">
      <div class="step-icon">${s.icon}</div>
      <div class="step-body"><div class="step-name">${s.name}</div><div class="step-detail" id="d_${s.id}">Waiting...</div></div>
    </div>`).join('');
}
function setStep(id,state,detail){
  const el=document.getElementById('s_'+id), d=document.getElementById('d_'+id);
  if(el) el.className='step '+state;
  if(d&&detail!==undefined) d.innerHTML=detail;
}
function showResult(ok,title,body){
  const r=document.getElementById('result');
  r.className='result visible '+(ok?'ok':'fail');
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultBody').innerHTML=body;
}

// SF via Claude API (no CORS issues — goes through Anthropic's servers)
async function callClaude(system, user){
  const resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:2000,
      system, messages:[{role:'user',content:user}]
    })
  });
  if(!resp.ok) throw new Error('Claude API error: '+resp.status);
  const data = await resp.json();
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
}

async function callClaudeWithMCP(system, user, mcpServers){
  const resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:2000,
      system, messages:[{role:'user',content:user}],
      mcp_servers: mcpServers
    })
  });
  if(!resp.ok) throw new Error('Claude API error: '+resp.status);
  const data = await resp.json();
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
}

async function run(){
  const jiraUrl = document.getElementById('jiraUrl').value.trim();
  if(!jiraUrl) { alert('Please enter a Jira Epic URL.'); return; }
  if(!jiraUrl.match(/browse\/\w+-\d+/)) { alert('Invalid Jira URL.'); return; }
  const issueKey = jiraUrl.match(/browse\/(\w+-\d+)/)[1];

  document.getElementById('runBtn').disabled=true;
  document.getElementById('logCard').className='card log-card visible';
  document.getElementById('result').className='result';
  initSteps();

  let companyName, contactEmail, sfCampaignId, sfCampaignUrl, sfToken, sfInstance;

  try {
    // ── Step 1: SF Auth via Claude API ──────────────────────────────
    setStep('sf_auth','running','Authenticating via Claude...');
    const sfAuthResult = await callClaude(
      `You are a Salesforce automation assistant. Make a SOAP login request to Salesforce and return ONLY a JSON object with sessionId and instanceUrl. No other text.
      
      The SOAP endpoint is: https://login.salesforce.com/services/Soap/u/59.0
      Username: ${SF_USER}
      Password+Token: ${SF_PASS}
      
      Parse the XML response and return: {"sessionId":"...","instanceUrl":"https://..."}`,
      'Login to Salesforce and return the session credentials as JSON.'
    );
    let sfCreds;
    try { sfCreds = JSON.parse(sfAuthResult.replace(/```json|```/g,'').trim()); }
    catch { throw new Error('SF auth parse failed: ' + sfAuthResult.slice(0,200)); }
    sfToken = sfCreds.sessionId;
    sfInstance = sfCreds.instanceUrl;
    setStep('sf_auth','done','Authenticated ✓');

    // ── Step 2: Read Jira + do all SF ops via Claude ─────────────────
    setStep('jira','running','Fetching epic details...');
    const automationResult = await callClaude(
      `You are an automation assistant. Do the following steps and return ONLY a JSON object at the end.

      STEP 1 - Read Jira Epic:
      GET https://api.atlassian.com/ex/jira/${JIRA_CLOUD}/rest/api/3/issue/${issueKey}
      Header: Authorization: ${JIRA_AUTH}
      Extract: companyName (from summary before " - Ecosystem Partner"), contactEmail (first email in description)

      STEP 2 - Find SF Account:
      GET ${sfInstance}/services/data/v59.0/query?q=SELECT+Id,Name+FROM+Account+WHERE+Name+LIKE+'%25{companyName}%25'+LIMIT+5
      Header: Authorization: Bearer ${sfToken}
      Get: sfAccountId

      STEP 3 - Find/Create SF Opportunity:
      GET ${sfInstance}/services/data/v59.0/query?q=SELECT+Id+FROM+Opportunity+WHERE+AccountId='{sfAccountId}'+AND+Name+LIKE+'%25Referral%25'+LIMIT+3
      If none found, POST to ${sfInstance}/services/data/v59.0/sobjects/Opportunity with Name="{companyName} Referral Agreement", AccountId, StageName="Closed Won", CloseDate=today, Type="Existing Business"

      STEP 4 - Find Parent Campaign:
      GET ${sfInstance}/services/data/v59.0/query?q=SELECT+Id+FROM+Campaign+WHERE+Name='Partner+Referral'+LIMIT+1

      STEP 5 - Find Owner (Samir):
      GET ${sfInstance}/services/data/v59.0/query?q=SELECT+Id+FROM+User+WHERE+Username='s.hatef@xsolla.com'+LIMIT+1

      STEP 6 - Create SF Campaign:
      POST ${sfInstance}/services/data/v59.0/sobjects/Campaign
      Body: {Name: "{companyName} Referral Program", IsActive: true, Status: "Planned", Type: "Referral Program", AccountId: sfAccountId, OwnerId: ownerId, ParentId: parentCampaignId (if found)}
      Get: sfCampaignId
      Build: sfCampaignUrl = "${sfInstance}/lightning/r/Campaign/{sfCampaignId}/view"

      Return ONLY this JSON (no markdown, no explanation):
      {"companyName":"...","contactEmail":"...","sfCampaignId":"...","sfCampaignUrl":"..."}`,
      `Run all the automation steps for Jira issue ${issueKey} and return the JSON result.`
    );

    let autoData;
    try { autoData = JSON.parse(automationResult.replace(/```json|```/g,'').trim()); }
    catch { throw new Error('Automation parse failed: ' + automationResult.slice(0,300)); }
    companyName = autoData.companyName;
    contactEmail = autoData.contactEmail;
    sfCampaignId = autoData.sfCampaignId;
    sfCampaignUrl = autoData.sfCampaignUrl;
    setStep('jira','done',`<strong>${companyName}</strong> · ${contactEmail}`);
    setStep('sf_camp','done',`<a href="${sfCampaignUrl}" target="_blank">${companyName} Referral Program ↗</a>`);

    // ── Step 3: Jira Web Link + Close via Claude with MCP ───────────
    setStep('jira_link','running','Adding SF link to Jira...');
    await callClaudeWithMCP(
      `Use the Atlassian MCP to add a remote web link to Jira issue ${issueKey} on cloudId "xsolla.atlassian.net".
      POST to /rest/api/3/issue/${issueKey}/remotelink with: {globalId:"sf-campaign-${sfCampaignId}", relationship:"Salesforce Campaign", object:{url:"${sfCampaignUrl}", title:"${companyName} Referral Program"}}
      Respond with "done".`,
      `Add Salesforce campaign web link to Jira ${issueKey}`,
      MCP_JIRA
    );
    setStep('jira_link','done','Web link added to Jira ✓');

    setStep('jira_close','running','Transitioning to Closed/Won...');
    await callClaudeWithMCP(
      `Use Atlassian MCP to transition Jira issue ${issueKey} on cloudId "xsolla.atlassian.net" to "Closed/Won" status.
      1) Call getTransitionsForJiraIssue 2) Find Closed/Won transition ID 3) Call transitionJiraIssue.
      Respond "done" when complete.`,
      `Transition ${issueKey} to Closed/Won`,
      MCP_JIRA
    );
    setStep('jira_close','done','Epic marked Closed/Won ✓');

    // ── Step 4: Send email via n8n ───────────────────────────────────
    setStep('email','running',`Sending to ${contactEmail}...`);
    const emailResp = await fetch(N8N_EMAIL_WEBHOOK,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({companyName, contactEmail, sfCampaignUrl})
    });
    const emailData = await emailResp.json().catch(()=>({}));
    if(!emailResp.ok || emailData.success===false) throw new Error('Email failed: '+(emailData.error||emailResp.status));
    setStep('email','done',`Sent to <strong>${contactEmail}</strong> · CC: bizdev@xsolla.com · Both badge images attached ✓`);

    showResult(true,'✅ All done!',
      `Company: ${companyName}\nContact: ${contactEmail}\nSalesforce: <a href="${sfCampaignUrl}" target="_blank">${sfCampaignUrl}</a>\nJira ${issueKey}: Closed/Won\nEmail: Sent with both Preferred badge images`
    );

  } catch(err){
    STEP_DEFS.forEach(s=>{
      if(document.getElementById('s_'+s.id)?.className.includes('running'))
        setStep(s.id,'error',err.message);
    });
    showResult(false,'❌ Failed',err.message);
    console.error(err);
  }
  document.getElementById('runBtn').disabled=false;
}
</script>
</body>
</html>
